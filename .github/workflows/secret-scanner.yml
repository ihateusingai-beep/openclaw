name: Secret Scanner

on:
  push:
    branches: [my-hardened-version]
  pull_request:
    branches: [my-hardened-version]
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  detect-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: ihateusingai-beep/openclaw
          ref: my-hardened-version

      - name: Run detect-secrets
        run: |
          echo "=== Running detect-secrets scan ==="
          # Install detect-secrets
          pip install detect-secrets 2>&1 | tail -2
          
          # First, audit existing baseline to understand current state
          echo "=== Baseline audit ==="
          detect-secrets audit .secrets.baseline 2>&1 || true
          
          # Scan and update baseline (merge new findings)
          echo "=== Scanning for new secrets ==="
          detect-secrets scan . > .secrets.new.baseline 2>&1 || true
          
          # Compare with baseline
          if [ -f .secrets.new.baseline ]; then
            OLD_COUNT=$(grep -c '"secret"' .secrets.baseline 2>/dev/null || echo 0)
            NEW_COUNT=$(grep -c '"secret"' .secrets.new.baseline 2>/dev/null || echo 0)
            echo "Baseline secrets: $OLD_COUNT"
            echo "Current scan secrets: $NEW_COUNT"
            
            if [ "$NEW_COUNT" -gt "$OLD_COUNT" ]; then
              echo "⚠️  WARNING: New secrets detected!"
              detect-secrets audit .secrets.baseline 2>&1 | head -20
            else
              echo "✅ No new secrets found"
            fi
          fi

  api-key-leak-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: ihateusingai-beep/openclaw
          ref: my-hardened-version

      - name: Scan for leaked keys
        run: |
          echo "=== API Key Leak Scan ==="
          # Common patterns
          grep -rEI "(sk-[a-zA-Z0-9]{20,}|api[_-]key['\"]?\\s*[:=]\\s*['\"]?[a-zA-Z0-9]{20,}|OPENAI_API_KEY|ANTHROPIC_API_KEY|MINIMAX)" \
            --include="*.ts" --include="*.js" --include="*.json" \
            --exclude-dir=node_modules --exclude-dir=.git . 2>/dev/null | head -20 || echo "No leaked keys found"

      - name: Check openclaw.json for real keys
        run: |
          echo "=== Config Key Check ==="
          if [ -f ~/.openclaw/openclaw.json ]; then
            # Should only have placeholder values
            if grep -qE '"sk-[a-zA-Z0-9]{32,}"' ~/.openclaw/openclaw.json 2>/dev/null; then
              echo "❌ Real API keys found in config - this is dangerous!"
            else
              echo "✅ No obvious real API keys in config"
            fi
          fi