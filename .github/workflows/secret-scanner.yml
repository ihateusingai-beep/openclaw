name: Secret Scanner

on:
  push:
    branches: [my-hardened-version]
  pull_request:
    branches: [my-hardened-version]
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  detect-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: ihateusingai-beep/openclaw
          ref: my-hardened-version

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run detect-secrets
        run: |
          echo "=== Running detect-secrets scan ==="
          pip install detect-secrets 2>&1 | tail -3
          
          echo "=== Scanning repo ==="
          detect-secrets scan . > /tmp/new_scan.json 2>&1 || true
          
          echo "=== Current baseline secrets ==="
          cat .secrets.baseline | grep -c '"secret"' || echo "0"
          
          echo "=== New scan secrets ==="
          cat /tmp/new_scan.json 2>/dev/null | grep -c '"secret"' || echo "0"
          
          echo "✅ Secret scan completed"

  api-key-leak-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: ihateusingai-beep/openclaw
          ref: my-hardened-version

      - name: Scan for leaked keys
        run: |
          echo "=== API Key Leak Scan ==="
          grep -rEI "(sk-[a-zA-Z0-9]{20,}|api[_-]key['\"]?\\s*[:=]\\s*['\"]?[a-zA-Z0-9]{20,}|OPENAI_API_KEY|ANTHROPIC_API_KEY|MINIMAX)" \
            --include="*.ts" --include="*.js" --include="*.json" \
            --exclude-dir=node_modules --exclude-dir=.git . 2>/dev/null | head -20 || echo "No leaked keys found"

      - name: Check for secrets in code
        run: |
          echo "=== Hardcoded Secret Check ==="
          # Check for common secret patterns in source
          FOUND=0
          for pattern in "password\s*=\s*['\"][^'\"]{8,}" "secret\s*=\s*['\"][^'\"]{8,}" "token\s*=\s*['\"][^'\"]{8,}"; do
            if grep -rEI "$pattern" --include="*.ts" --include="*.js" --exclude-dir=node_modules . 2>/dev/null | grep -v ".secrets.baseline" | grep -v "node_modules" | head -1 > /dev/null; then
              echo "⚠️  Possible secret found: $pattern"
              FOUND=$((FOUND+1))
            fi
          done
          if [ $FOUND -eq 0 ]; then
            echo "✅ No obvious hardcoded secrets found"
          fi