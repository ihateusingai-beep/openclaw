name: Secret Scanner

on:
  push:
    branches: [my-hardened-version]
  pull_request:
    branches: [my-hardened-version]
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  detect-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: ihateusingai-beep/openclaw
          ref: my-hardened-version

      - name: Run detect-secrets
        uses: IBM/detect-secrets@v0.0.2
        with:
          baseline_file: .secrets.baseline
          exclude_files: |
            node_modules/
            .git/
            **/*.lock
            extensions/**/node_modules/

      - name: Report
        if: always()
        run: |
          echo "## 🔐 Secret Scan Report" >> $GITHUB_STEP_SUMMARY
          echo "- Timestamp: $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: ${{ github.ref }}" >> $GITHUB_STEP_SUMMARY
          if [ -f .secrets.baseline ]; then
            COUNT=$(grep -c '"secret"' .secrets.baseline 2>/dev/null || echo 0)
            echo "- Secrets found: $COUNT" >> $GITHUB_STEP_SUMMARY
          else
            echo "- No baseline file - first run" >> $GITHUB_STEP_SUMMARY
          fi

  api-key-leak-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: ihateusingai-beep/openclaw
          ref: my-hardened-version

      - name: Scan for leaked keys
        run: |
          echo "=== API Key Leak Scan ==="
          # Common patterns
          grep -rEI "(sk-[a-zA-Z0-9]{20,}|api[_-]key['\"]?\\s*[:=]\\s*['\"]?[a-zA-Z0-9]{20,}|OPENAI_API_KEY|ANTHROPIC_API_KEY|MINIMAX)" \
            --include="*.ts" --include="*.js" --include="*.json" \
            --exclude-dir=node_modules --exclude-dir=.git . 2>/dev/null | head -20 || echo "No leaked keys found"

      - name: Check openclaw.json for real keys
        run: |
          echo "=== Config Key Check ==="
          if [ -f ~/.openclaw/openclaw.json ]; then
            # Should only have placeholder values
            if grep -qE '"sk-[a-zA-Z0-9]{32,}"' ~/.openclaw/openclaw.json 2>/dev/null; then
              echo "❌ Real API keys found in config - this is dangerous!"
            else
              echo "✅ No obvious real API keys in config"
            fi
          fi